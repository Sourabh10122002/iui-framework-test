name: Publish to GitHub Packages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'integrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'rollup.config*.js'
      - 'tsconfig*.json'
      - '.github/workflows/publish.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (leave empty to use package.json version)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://npm.pkg.github.com
          scope: '@inventive-ui'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Get package version
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Package version: $VERSION"

      - name: Check if version exists
        id: version-check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          PACKAGE_NAME=$(node -p "require('./package.json').name")

          if npm view ${PACKAGE_NAME}@${VERSION} version > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️  Version ${VERSION} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Version ${VERSION} is available for publishing"
          fi

      - name: Publish package
        if: steps.version-check.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "🚀 Publishing to GitHub Packages..."
          npm publish --access restricted
          echo "✅ Successfully published version ${{ steps.package-version.outputs.version }}"

      - name: Version already exists
        if: steps.version-check.outputs.exists == 'true'
        run: |
          echo "ℹ️  Version ${{ steps.package-version.outputs.version }} already exists"
          echo "Skipping publish step."

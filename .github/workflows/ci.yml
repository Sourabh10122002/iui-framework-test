name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.editorconfig'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Dist gates
        run: npm run build && npm run test:dist

      - name: Integration apps verifier
        run: npm run test:integration-apps

      - name: Pack gates (publint + attw)
        run: npm run verify:pack

      - name: Upload coverage reports
        if: always() && secrets.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    name: Build & Dist Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Check build artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          for f in \
            dist/index.esm.js dist/index.cjs dist/index.d.ts \
            dist/slots.esm.js dist/slots.cjs \
            dist/shade.esm.js dist/shade.cjs dist/shade.d.ts \
            dist/server/index.esm.js dist/server/index.cjs \
            dist/node/build-css-api.cjs dist/node/build-css-api.mjs
          do
            if [ ! -f "$f" ]; then
              echo "Missing build artifact: $f"
              exit 1
            fi
          done
          echo "✅ Build artifacts created successfully"

      - name: Compile-first + shade migration dist gates
        run: npm run test:dist

name: Publish to npmjs.org

# NOTE: This workflow is disabled by default since package.json is configured for GitHub Packages
# To use this workflow, you need:
# 1. An npm Automation token (starts with 'npm_') in NPM_TOKEN secret
# 2. The @inventive-ui scope created on npmjs.org
# 3. Update package.json publishConfig.registry to 'https://registry.npmjs.org'
#
# Heavy gates (test:dist, jest, pack) run in CI — not during publish.
# Optional local full check: npm run prepublish:check

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm publishing to npmjs.org'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to npmjs.org
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "publish" ]; then
            echo "❌ Confirmation required. Type 'publish' in the workflow dispatch input."
            exit 1
          fi
          echo "✅ Confirmation received"

      - name: Check publishConfig
        run: |
          REGISTRY=$(node -p "require('./package.json').publishConfig?.registry || 'not set'")
          if [[ "${REGISTRY}" != *"registry.npmjs.org"* ]]; then
            echo "⚠️  WARNING: package.json publishConfig.registry is set to: ${REGISTRY}"
            echo "   This workflow will override it, but consider updating package.json for consistency"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@inventive-ui'
          cache: 'npm'
          always-auth: true

      - name: Install dependencies
        run: npm ci

      - name: Get package version
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Package version: $VERSION"

      - name: Verify npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "❌ NPM_TOKEN secret is not set!"
            echo "   You need an npm Automation token (starts with 'npm_')"
            exit 1
          fi

          TOKEN_PREFIX="${NODE_AUTH_TOKEN:0:4}"
          if [[ "${NODE_AUTH_TOKEN}" =~ ^npm_ ]]; then
            echo "✅ npm token detected"
          else
            echo "❌ ERROR: NPM_TOKEN must be an npm Automation token (starts with 'npm_')"
            echo "   Current token starts with: ${TOKEN_PREFIX}"
            echo "   Get one from: https://www.npmjs.com/settings/YOUR_USERNAME/tokens"
            exit 1
          fi

          npm whoami --registry=https://registry.npmjs.org || (echo "❌ npm authentication failed" && exit 1)
          echo "✅ npm authentication successful"

      - name: Check if version exists
        id: version-check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          PACKAGE_NAME=$(node -p "require('./package.json').name")

          if npm view ${PACKAGE_NAME}@${VERSION} version > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️  Version ${VERSION} already exists on npmjs.org"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Version ${VERSION} is available for publishing"
          fi

      - name: Publish package
        if: steps.version-check.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "🚀 Publishing to npmjs.org..."
          npm publish --access restricted --registry=https://registry.npmjs.org
          echo "✅ Successfully published version ${{ steps.package-version.outputs.version }}"

      - name: Version already exists
        if: steps.version-check.outputs.exists == 'true'
        run: |
          echo "ℹ️  Version ${{ steps.package-version.outputs.version }} already exists on npmjs.org"
          echo "Skipping publish step."
